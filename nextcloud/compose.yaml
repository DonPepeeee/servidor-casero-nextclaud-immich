# Versiones exactas versionadas aqui; .env contiene credenciales y ajustes locales.
# No añadir restart always/unless-stopped.
# El supervisor de este proyecto es cloud@nextcloud.service.
x-runtime: &runtime
  restart: "no"
  stop_grace_period: 90s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

x-nextcloud-environment: &nextcloud-environment
  POSTGRES_HOST: db
  POSTGRES_DB: nextcloud
  POSTGRES_USER: nextcloud
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
  REDIS_HOST: redis
  NEXTCLOUD_DATA_DIR: /var/www/data
  TZ: Europe/Madrid
  PHP_MEMORY_LIMIT: 512M
  OVERWRITECLIURL: ${NEXTCLOUD_URL:-http://localhost:8080}
  OVERWRITEPROTOCOL: ${NEXTCLOUD_PROTOCOL:-http}
  TRUSTED_PROXIES: ${NEXTCLOUD_TRUSTED_PROXIES:-127.0.0.1}

services:
  db:
    <<: *runtime
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env}
      TZ: Europe/Madrid
    volumes:
      - type: bind
        source: /srv/appdata/nextcloud/postgres
        target: /var/lib/postgresql/data
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    <<: *runtime
    image: redis:8.10.2-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    tmpfs:
      - /data:size=64m,mode=1777
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    <<: *runtime
    image: &nextcloud-image nextcloud:35.0.2-apache
    environment:
      <<: *nextcloud-environment
      NEXTCLOUD_ADMIN_USER: ${NEXTCLOUD_ADMIN_USER:?Falta NEXTCLOUD_ADMIN_USER en .env}
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_ADMIN_PASSWORD:?Falta NEXTCLOUD_ADMIN_PASSWORD en .env}
      # Solo inicializa dominios al instalar; en instalaciones existentes usar occ.
      NEXTCLOUD_TRUSTED_DOMAINS: localhost 127.0.0.1 ${NEXTCLOUD_EXTRA_TRUSTED_DOMAIN:-localhost}
      APACHE_DISABLE_REWRITE_IP: "1"
    ports:
      - "127.0.0.1:8080:80"
    volumes: &nextcloud-volumes
      - type: bind
        source: /srv/appdata/nextcloud/html
        target: /var/www/html
        bind:
          create_host_path: false
      - type: bind
        source: /srv/storage/nextcloud/data
        target: /var/www/data
        bind:
          create_host_path: false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - php
        - -r
        - >-
          $$s = json_decode(@file_get_contents("http://127.0.0.1/status.php"), true);
          exit(is_array($$s) && !empty($$s["installed"]) && empty($$s["maintenance"]) && empty($$s["needsDbUpgrade"]) ? 0 : 1);
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 120s

  cron:
    <<: *runtime
    image: *nextcloud-image
    entrypoint: /cron.sh
    environment: *nextcloud-environment
    volumes: *nextcloud-volumes
    depends_on:
      app:
        condition: service_healthy
